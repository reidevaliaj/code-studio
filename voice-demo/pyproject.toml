[project]
name = "codst-voice-demo"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "livekit-agents==1.8.0",
  "livekit-plugins-openai==1.8.0",
  "openai[realtime]==2.54.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx==0.28.1",
  "psutil>=6,<8",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
